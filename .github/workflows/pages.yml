name: Website

on:
  pull_request:
    branches: [main]
    paths: ['site/**', 'docs/images/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site tooling
        run: npm ci --prefix site
      - name: Validate HTML, CSS and JavaScript
        run: npm run lint --prefix site
      - name: Build static preview
        run: npm run build --prefix site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.0
      # Select GitHub Actions as the repository Pages source before the first deployment.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build for canonical Pages URL
        env:
          PAGES_BASE_URL: https://llmtest.managed-code.com
        run: python3 site/build.py --base-url "$PAGES_BASE_URL"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
