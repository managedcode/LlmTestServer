name: Website

on:
  pull_request:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site tooling
        run: npm ci --prefix site
      - name: Validate HTML, CSS and JavaScript
        run: npm run lint --prefix site
      - name: Build static preview
        run: npm run build --prefix site

  deploy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Select GitHub Actions as the repository Pages source before the first deployment.
      - name: Require the verified release before publishing the landing page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("Directory.Build.props").findtext(".//Version"))')
          gh release view "v$version" --json assets --jq '.assets[].name' | grep -qx 'nuget-published.txt'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build for canonical Pages URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 site/build.py --base-url "$PAGES_BASE_URL"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
